name: Daily BD AS Quiz Updater

on:
  schedule:
    # GitHub Actions 使用 UTC 時間：
    # UTC 00:00 = 香港時間 08:00 (晨卷)
    # UTC 10:00 = 香港時間 18:00 (傍晚卷)
    - cron: '0 0 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # 允許你在 GitHub 介面手動點擊「Run workflow」隨時觸發換題

permissions:
  contents: write # 必須給予寫入權限才能將更新推送到 Repo

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Quiz Rotation Script
        run: python scripts/update_quiz.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add current_quiz.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quiz questions [skip ci]" && git push)
