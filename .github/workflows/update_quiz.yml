name: Daily BD AS English Quiz Generator

on:
  schedule:
    # GitHub Actions 使用 UTC 時間 (香港時間 - 8 小時)：
    # UTC 00:00 = 香港時間 (HKT) 08:00 (Morning Session)
    - cron: '0 0 * * *'
    # UTC 10:00 = 香港時間 (HKT) 18:00 (Evening Session)
    - cron: '0 10 * * *'
  workflow_dispatch: # 允許隨時在 GitHub 網頁上手動點擊「Run workflow」即時生成新考卷

permissions:
  contents: write # 賦予 Actions 自動 commit 與 push 的寫入權限

jobs:
  generate-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Question Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_quiz.py

      - name: Commit and Push Updated Quiz
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add current_quiz.json history_log.txt
          git diff --staged --quiet || (git commit -m "Auto-generate 30 English BD AS Exam Questions [skip ci]" && git push)
